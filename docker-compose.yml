services:
  telemetry_server:
    # build:
    #   context: /home/jetson/Desktop/telematics_src/
    #   dockerfile: Dockerfile.production
#    image: telematics_server:latest
    image: 10.10.60.250:5005/telematics_server:f8-v8-alpha-4
    # image: ${TELEMATICS_REGISTRY_URL}/telematics_server:${TELEMATICS_CURRENT_VERSION}
    container_name: telematics_server
    restart: "no"
    network_mode: "host"
    privileged: true
    pid: host
    cap_add:
      - SYS_BOOT
      - SYS_TIME
    env_file:
      - ./.env

    volumes:
      - /dev:/dev
      - ./telematics/data:/app/data
      - ./telematics/config:/app/config
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    device_cgroup_rules:
      - "c 188:* rmw"

    environment:
      - TZ=Asia/Kolkata

  obd:
    container_name: obd
   # image: 192.168.168.101:5000/scout-obdv1:latest
    image: ${OBD_REGITRY_URL}/scout-obd:${OBD_CURRENT_VERSION}
    # build:
    #   context: ./obd
    #   dockerfile: Dockerfile
    restart: "no"
    network_mode: "host"
    ipc: "host"
    privileged: true
    runtime: nvidia
    user: "1000:1000"
    group_add:
      - "44"
      - "104"
      - "995"
    env_file:
      - ./.env

    environment:
      - TZ=Asia/Kolkata
      - DISPLAY=${DISPLAY:-:0}
      - GDK_BACKEND=x11
      - XAUTHORITY=/run/user/1000/gdm/Xauthority
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000:/run/user/1000
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock:ro
