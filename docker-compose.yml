services:
  telemetry_server:
    build:
      context: ../telematics_src
      dockerfile: Dockerfile.production
    # image: 10.10.60.225:5000/telematics_server:f3-v3-alpha-4
    container_name: telematics_server
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    pid: host
    cap_add:
      - SYS_BOOT
      - SYS_TIME

    volumes:
      - /dev:/dev
      - ./telematics/data:/app/data
      - ./telematics/config:/app/config
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # ttyUSB (188) + ttyACM (166) for USB-CAN / motor UART when plugged
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"

    environment:
      - TZ=Asia/Kolkata

  obd:
    container_name: obd
    # Registry image may ship Jetson/arm64 binaries; build locally for host arch (Dynalog x86_64).
    image: 10.10.60.225:5000/scout-obd:f4-v4-alpha-1
    build:
      context: ./obd
      dockerfile: Dockerfile
    restart: "no"
    network_mode: "host"
    ipc: "host"
    privileged: true
    user: "1000:1000"
    group_add:
      - "44"
      - "110"

    environment:
      - TZ=Asia/Kolkata
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTHORITY:-/run/user/1000/gdm/Xauthority}
      - GDK_BACKEND=x11
      - XDG_RUNTIME_DIR=/run/user/1000
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /run/user/1000:/run/user/1000
      - /dev/dri:/dev/dri
      - /dev:/dev
      - /var/run/docker.sock:/var/run/docker.sock:ro
