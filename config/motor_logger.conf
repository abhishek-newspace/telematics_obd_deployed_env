# Motor UART telemetry logger — runtime configuration
# Override any key via environment: MOTOR_LOG_<KEY> (uppercase, underscores)

ugv_id=UGV_IRIS_DEFAULT_01

log_base_dir=data
log_power_cycle_prefix=power_cycle_

serial_baud=38400
poll_hz=5
startup_delay_sec=2
read_timeout_sec=0.15
serial_timeout_sec=1.0
port_wait_timeout_sec=0
connect_retry_sec=5

front_enabled=true
front_serial=/dev/ttyUSB0
front_swap_motors=true
front_label=Front
front_csv_filename=motor_front_telemetry.csv

rear_enabled=false
rear_serial=/dev/ttyUSB1
rear_swap_motors=false
rear_label=Rear
rear_csv_filename=motor_rear_telemetry.csv

show_dashboard=true
