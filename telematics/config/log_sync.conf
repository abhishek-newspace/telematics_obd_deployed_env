# =============================================================================
# LOG SYNC / STORE-AND-FORWARD (log_sync.conf)
# =============================================================================
# Live logs use the shared session layout from can_log.conf:
#   data/active/power_cycle_<ts>/{can,motor,gnss,lband,ve_charger,ros}/
#
# The current power_cycle_* folder stays in data/active/ while the vehicle is
# writing. On restart (new power cycle), closed folders are harvested to
# outbox/, rclone-copied with checksum, ACKed, then archived or deleted
# (keep_archive).
#
# Harvest scans log_base_dir from can_log.conf (data/active), not per-stream
# category folders.
#
# log_sync does not create or rotate power cycles. Those exist only on boot.
#
# Password: set LOG_SYNC_SFTP_PASS, or put password=... in password_file
# (config/log_sync.secrets — not committed).
# =============================================================================

enabled=true

# sftp = LAN/cloud file server (later: same engine, change host/path to S3).
# local = copy to local_dest_path (mock / NAS mount) without SFTP.
remote_type=sftp
host=10.10.60.250
port=22
user=server
password_file=config/log_sync.secrets
remote_path=telematics_logs
local_dest_path=

outbox_dir=data/log_sync/outbox
archive_dir=data/log_sync/archive
known_hosts_file=data/log_sync/known_hosts
# After a CLOSED cycle gets rclone exit 0:
#   true  = move it to archive_dir (keep a local copy)
#   false = delete it from the outbox to free disk
keep_archive=true

rclone_bin=rclone
bwlimit=1M
checksum=true
transfers=2
rclone_retries=5

poll_interval_sec=30
endpoint_retry_sec=30
connect_timeout_sec=15
rclone_timeout_sec=0
power_off_sync_timeout_sec=15
