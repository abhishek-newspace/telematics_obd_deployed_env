# =============================================================================
# GNSS LOG CONFIGURATION (gnss_log.conf)
# =============================================================================
# GNSS TCP client -> decoded fix CSV + combined raw NMEA archive.
# Companion: config/can_log.conf (sets gnss_config_path).
#
# Manual source check:
#   nc 192.168.168.26 7800
#
# Environment override: GNSS_LOG_CONFIG
# =============================================================================

# -----------------------------------------------------------------------------
# Enable / identity
# -----------------------------------------------------------------------------
gnss_enabled=true
ugv_id=UGV_IRIS_DEFAULT_01

# -----------------------------------------------------------------------------
# File logging (under data/active/power_cycle_<ts>/gnss/ by default)
# -----------------------------------------------------------------------------
log_subdir=gnss
log_power_cycle_prefix=power_cycle_
# Decoded epoch rows (RMC+GGA+HDT merged) — analysis-friendly.
# Set log_csv=false to keep only raw NMEA (no gnss_fix*.csv).
log_csv=false
log_filename=gnss_fix.csv
# Combined raw NMEA stream (ALL sentences: GGA/RMC/HDT/GSA/GSV/VTG/ZDA/ROT/PSAT…).
# Industry standard archive format for RTKLIB / u-center / post-processing.
log_raw_nmea=true
log_raw_filename=gnss_raw.nmea
# Write session_manifest.txt (optional — CSV/NMEA files already have #; headers).
log_session_manifest=false
log_flush_interval_sec=3
log_max_file_size_mb=100
log_max_log_files=10

# -----------------------------------------------------------------------------
# GNSS source — TCP client (like: nc 192.168.168.26 7800)
# -----------------------------------------------------------------------------
source_host=192.168.168.26
source_port=7800
source_connect_retry_sec=5
source_connect_timeout_ms=3000
source_recv_timeout_ms=5000

# -----------------------------------------------------------------------------
# Status logging
# -----------------------------------------------------------------------------
status_log_interval_sec=10
