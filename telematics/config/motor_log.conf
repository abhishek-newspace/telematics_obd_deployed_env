# =============================================================================
# MOTOR LOG CONFIGURATION (motor_log.conf)
# =============================================================================
# Motor controller UART/CAN telemetry, periodic drive commands, and CSV logging.
# Companion file: config/can_log.conf (CAN buses and SEC_COMP relays).
#
# API: motor_cmd::send_*() in MotorCommandExecutor.hpp
# Docs: docs/MOTOR_PROTOCOL.md, docs/MOTOR_COMMAND_GUIDE.md
#
# Environment overrides (see MotorConfig.cpp):
#   MOTOR_LOG_CONFIG — path to this file
#   MOTOR_LOG_<KEY>  — any key below (e.g. MOTOR_LOG_FRONT_SERIAL)
#
# Restart the application after edits (config is not hot-reloaded).
# =============================================================================

# -----------------------------------------------------------------------------
# Identity & motor CSV logging
# -----------------------------------------------------------------------------
ugv_id=UGV_IRIS_DEFAULT_01
log_subdir=motor
log_power_cycle_prefix=power_cycle_
# session_manifest.txt for motor uses the SAME flag as CAN:
#   can_log.conf → log_session_manifest=true|false
# (no separate motor setting)

# -----------------------------------------------------------------------------
# Transport — RS485 UART vs CAN (same 0xF1 protocol)
# -----------------------------------------------------------------------------
# motor_transport:
#   rs485  — front_serial / rear_serial @ serial_baud (typical bench setup)
#   can    — USB-CAN bus from can_log.conf (motor_can_bus_id)
#   auto   — CAN when motor_control_type=2, else RS485
#
# CAN IDs (host view):
#   motor_can_host_tx_id = MCU receive ID — host sends here
#   motor_can_host_rx_id = MCU send ID    — host listens here
# Leave motor_can_host_* at 0 to inherit from baked motor_params_*.conf.
# Increase read_timeout_sec for CAN (e.g. 2.0) — multiframe responses need more time.
motor_transport=rs485
motor_control_type=2
motor_can_bus_id=CAN1
motor_can_host_tx_id=0
motor_can_host_rx_id=0
motor_can_frame_interval_ms=0

# -----------------------------------------------------------------------------
# Serial link timing
# -----------------------------------------------------------------------------
serial_baud=38400
poll_hz=5
startup_delay_sec=2
# read_timeout_sec=0.5
# serial_timeout_sec=1.0
read_timeout_sec=2.0
serial_timeout_sec=2.0
port_wait_timeout_sec=0
connect_retry_sec=5

# Console dashboard (periodic telemetry summary) — disabled in production.
show_dashboard=false
dashboard_log_interval_sec=2

# -----------------------------------------------------------------------------
# Front / rear motor controllers
# -----------------------------------------------------------------------------
# front_swap_motors only swaps dashboard/CSV labels, not UART wiring:
#   swap=true  → dashboard M1 = MCU M2 (use drive_m2_*)
#   swap=false → dashboard M1 = MCU M1 (use drive_m1_*)
# front/rear (swapped 2026-08-06):
#   motor_front = Prolific ENBDb2A6709 → Port 3 / ttyUSB0
#   motor_rear  = Prolific DFBOo151406 → Port 5 / ttyUSB2
# Prefer /dev/telematics/motor_{front,rear} after: sudo ./install-usb-rules.sh
front_enabled=true
front_serial=/dev/telematics/motor_front
front_swap_motors=false
front_label=Front
front_csv_filename=motor_front_telemetry.csv
front_save_cfg_on_startup=false

rear_enabled=true
rear_serial=/dev/telematics/motor_rear
rear_swap_motors=false
rear_label=Rear
rear_csv_filename=motor_rear_telemetry.csv
rear_save_cfg_on_startup=false

# -----------------------------------------------------------------------------
# Periodic UART commands (one type per poll cycle; priority below)
# -----------------------------------------------------------------------------
# Priority: drive_awd > drive_m1 > drive_m2 > telemetry
#
# 0x91 telemetry_enabled=true, all drive_*=false
#     Read-only 200-byte status. Safe idle / logging. Does not move motors.
#
# 0x99 drive_m1_enabled=true  — command MCU M1 (drive_m1_current_a / drive_m1_speed_rpm)
# 0x98 drive_m2_enabled=true  — command MCU M2 (drive_m2_current_a / drive_m2_speed_rpm)
# 0x97 drive_awd_enabled=true — command both channels in one frame
#
# All command types return the same 200-byte telemetry layout for CSV + dashboard.
# Brake + mode are relayed to VCU via motor_status_relay in can_log.conf.
telemetry_enabled=true
drive_awd_enabled=false
drive_m1_enabled=false
drive_m2_enabled=false

drive_m1_current_a=0.0
drive_m1_iq_reserved=0.0
drive_m1_speed_rpm=0.0
drive_m2_current_a=0.0
drive_m2_iq_reserved=0.0
drive_m2_speed_rpm=0.0

# -----------------------------------------------------------------------------
# MCU flash save — PC_MCU_SAVE_CFG (0x92) over UART/CAN
# -----------------------------------------------------------------------------
# save_cfg_enabled — global master switch (must be true for any 0x92).
# front_save_cfg_on_startup / rear_save_cfg_on_startup — per axis (see above).
# Tuning values live in the save_* block below (shared payload).
# motor_params_*.conf are checksum-only — not used for 0x92.
#
# WARNING: wrong values can mis-tune the controller. Motors should be safe/unloaded.
save_cfg_enabled=false

# -----------------------------------------------------------------------------
# 0x92 tuning payload (shared — flashed when per-axis save flag is enabled)
# Keys: save_* prefix or vendor names (MaxCur_bus, Kp_Spd, …).
# -----------------------------------------------------------------------------
save_control_type=2
save_rs485_baud=38400
save_can_baud=4
save_tx_interval_ms=20
save_drive_downtime_s=20
save_brake_enable=0
save_hold_voltage_v=12
save_pickup_voltage_v=20
save_brake_delay_s=2
save_max_bus_current_a=100
save_max_phase_current_a=40
save_overcur_limit_a=50
save_max_voltage_v=60
save_min_voltage_v=21
save_overcur_time_ms=100
save_kp_idq=0
save_ki_idq=0
save_max_cur_time_ms=60
save_kp_speed=1000
save_ki_speed=2000
save_sf_tim_max_i=0.5
save_limit_max_cw=1
save_limit_max_ccw=1
save_brake_resistor_voltage_v=55
save_accel_pct=100
save_decel_pct=100
save_pole_pairs=10
save_m1_mode=1
save_m1_direction=0
save_m1_sensor_type=1
save_m2_mode=1
save_m2_direction=1
save_m2_sensor_type=1
save_rs_current_a=8
save_ls_current_a=-8
save_rl_hz=300
save_flux_vphz=0.1546638
save_rs_ohm=0.06966011
save_lsq_h=0.0002319918
save_lsd_h=0.0002319918

# -----------------------------------------------------------------------------
# Parameter checksum — baked baselines vs MCU telemetry (read-only, no MCU flash)
# Uses motor_params_*.conf only. Excludes live/unstable fields (comment them out there).
# -----------------------------------------------------------------------------
param_checksum_enabled=true
front_params_file=/app/baked/motor_params_front.conf
rear_params_file=/app/baked/motor_params_rear.conf
