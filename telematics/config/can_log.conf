# =============================================================================
# CAN LOG CONFIGURATION (can_log.conf)
# =============================================================================
# CAN bus trace logging (.trc), USB-CAN parser, SEC_COMP relays to VCU, simulation,
# and VCU power-off handling.
#
# Companion file: config/motor_log.conf (motor RS485/CAN telemetry and drive).
#
# Environment overrides (see src/config/Config.cpp):
#   UGV_ID                  — vehicle identifier
#   CAN_LOG_CONFIG          — path to this file (alias: TELEMATICS_CONFIG)
#   TELEMATICS_SIMULATION_MODE — true/false
#   TELEMATICS_LOG_DIR      — base log directory
#   TELEMATICS_UDP_HOST     — UDP forward destination for raw serial chunks
# =============================================================================

# -----------------------------------------------------------------------------
# Identity & runtime mode
# -----------------------------------------------------------------------------
# Vehicle ID written into log session metadata.
ugv_id=UGV_IRIS_DEFAULT_01

# true = no hardware; simulated CAN frames. false = read USB-CAN adapters.
simulation_mode=false

# Path to motor telemetry config (relative to working directory or absolute).
motor_config_path=config/motor_log.conf

# Path to GNSS relay + log config.
gnss_config_path=config/gnss_log.conf

# Path to L-band radio UDP raw log config (ICD §5.1).
lband_config_path=config/lband_log.conf

# Path to Victron VE.Direct DC-DC charger Text-mode log config.
ve_charger_config_path=config/ve_charger_log.conf

# Path to Rclone store-and-forward offload (outbox → SFTP/local).
log_sync_config_path=config/log_sync.conf

# Path to ROS2 topic logging via rosbridge WebSocket (main compute).
ros_config_path=config/ros_log.conf

# Application log level: trace, debug, info, warn, error.
app_log_level=info

# -----------------------------------------------------------------------------
# Console debug (docker logs telematics_server)
# -----------------------------------------------------------------------------
# Master switch: when false, info/debug/trace are suppressed on console.
# warn, error, and critical always appear. File logging is unaffected.
console_debug_enabled=false

# Per-component console debug (only apply when console_debug_enabled=true):
console_debug_app=false
console_debug_can=false
console_debug_motor=false
console_debug_gnss=false
console_debug_lband=false
console_debug_ve_charger=false
console_debug_ros=false
console_debug_log_sync=false
console_debug_relay=false
console_debug_time_sync=false
console_debug_power_off=false
console_debug_simulation=false

# -----------------------------------------------------------------------------
# CAN trace logging (.trc output)
# -----------------------------------------------------------------------------
# Root for live (active) sessions. Closed cycles move to data/log_sync/.
# Layout: <log_base_dir>/power_cycle_<IST>/<category>/  (can, motor, gnss, lband, ve_charger)
log_base_dir=data

# Category folder name under each power_cycle_* session (CAN .trc files).
log_can_subdir=can_logs

# Folder prefix for each power-cycle session (shared by all categories).
log_power_cycle_prefix=power_cycle_

# Periodic flush interval for open .trc files (seconds).
log_flush_interval_sec=3

# PCAN-View trace file header fields.
log_pcan_version=2.1
log_generator_name=Iris Telematics v1.1
log_can_protocol=CAN
log_can_bitrate=500 kbit/s

# Rotate .trc when file exceeds this size (MB); keep at most N files per bus.
log_max_trace_file_size_mb=100
log_max_trace_files_per_bus=10

# Bounded queue between CAN ingest threads and logging thread.
ingest_queue_max_frames=100000

# Stop writing ALL log streams (CAN, motor, GNSS, L-band, VE) when free disk
# space drops below this threshold (MB). The live power_cycle_* folder is kept.
# log_sync then deletes oldest closed cycles (archive, then outbox, then active/)
# until free space is above this value again.
disk_min_free_mb=500
disk_check_interval_sec=5

# false = wall-clock timestamps in .trc; true = monotonic + 0x202 anchor.
log_use_monotonic_timestamps=false

# Write session_manifest.txt in each can/motor power-cycle folder.
# Applies to BOTH CAN (.trc) and motor CSV sessions (same setting).
log_session_manifest=false

# -----------------------------------------------------------------------------
# UDP forwarding (optional raw serial mirror to OBD / debug host)
# -----------------------------------------------------------------------------
udp_host=127.0.0.1
# Comma-separated extra destination IPs (no port). CAN uses canN_udp_port per bus;
# app meta uses udp_obd_meta_port on each extra IP.
udp_forward_extra=192.168.168.101

# Publish ALL known app versions (telematics + atlas/vision/…) to OBD on both
# udp_host and udp_forward_extra using this single port. Prefer 49153; avoid 5005
# (can0_udp_port — raw CAN). Set udp_obd_meta_port=5005 only if OBD requires it.
udp_obd_meta_enabled=true
udp_obd_meta_port=49153
udp_obd_meta_app_name=telematics_worker
# Broadcast rate (Hz). 0.1 = once every 10 s. Set 0 for startup-only.
udp_obd_meta_hz=0.1

# Ingest app meta from atlas/vision (and peers) on a separate listen port.
udp_app_meta_listen_enabled=true
udp_app_meta_listen_port=49152
udp_app_meta_listen_bind=0.0.0.0
udp_app_meta_source_hosts=127.0.0.1,192.168.168.98
udp_app_meta_expected_apps=atlas,vision
udp_app_meta_log_subdir=app_meta
udp_app_meta_log_session_manifest=false

# -----------------------------------------------------------------------------
# USB-CAN serial link (hardware mode)
# -----------------------------------------------------------------------------
serial_baud=2000000
serial_read_buffer=1024
serial_poll_interval_us=1000
serial_config_delay_us=100000
serial_port_wait_timeout_sec=0
serial_connect_retry_sec=5

# -----------------------------------------------------------------------------
# Simulation (only when simulation_mode=true)
# -----------------------------------------------------------------------------
# Interval between simulated frame/chunk injections (microseconds).
simulation_interval_us=100000

# true = CAN0 runs stress playlist through reassembler; false = basic frame loop.
simulation_stress_frames=true

# Inject VCU_PWR_OFF_REQ2 (0x208) after delay to test flush + host shutdown path.
# simulation_pwr_off_enabled=true
# simulation_pwr_off_delay_sec=15
# Safe dry-run (no real power-off):
# vcu_pwr_off_req2_shutdown_command=touch /tmp/telematics_pwr_off_test && sync

# -----------------------------------------------------------------------------
# CAN frame parser (USB-CAN serial and SocketCAN)
# -----------------------------------------------------------------------------
# Keep envelope=true for both: USB adapters send AA..55; native SocketCAN ifaces
# are wrapped into the same AA|0xC0|DLC|ID|data|55 shape before parsing.
parser_frame_header=AA
parser_frame_tail=55
parser_use_frame_envelope=true

# false = accept every structurally valid frame; true = only known ICD CAN IDs.
parser_require_known_icd_id=false

# Support FF auxiliary marker bytes between frames.
parser_support_ff_marker=true
parser_log_ff_frames=false

# Dump only real reassembler misalignment (resync / large orphans). Single-byte
# USB inter-frame noise is discarded silently and is not a lost CAN frame.
parser_dump_dropped_bytes=false
parser_dropped_bytes_dir=data/can_logs/dropped_serial

# Adapter Rx/Tx markers for standard (11-bit) and extended (29-bit) CAN.
parser_rx_marker_std=C8
parser_tx_marker_std=C9
parser_rx_marker_ext=D8
parser_tx_marker_ext=D9

# Fallback when a frame cannot be parsed (simulation / error paths).
parser_default_can_id=0101
parser_default_dlc=8
parser_default_payload=09 60 00 0F 00 63 F0 A0

# -----------------------------------------------------------------------------
# Receive: COMP_GLOBAL_TIME_INFO (0x202) from main compute
# -----------------------------------------------------------------------------
# When log_use_monotonic_timestamps=true, first valid 0x202 sets trace time anchor.
comp_global_time_info_set_system_clock=false
comp_global_time_info_sync_interval_sec=10
comp_global_time_info_can_id=0202

# -----------------------------------------------------------------------------
# Receive: VCU_CAN_SYNC (0x99) on Aux — gate SEC_COMP Tx only (ICD §3.5.2.14)
# -----------------------------------------------------------------------------
# Does NOT affect TRC/UDP logging — 0x099 is always logged like any other frame.
# When enabled, Aux SEC_COMP Tx:
#   1) waits until VCU_CAN_SYNC running_counter == 0 (phase lock)
#   2) then TX when extended_counter % N == 0, N = round(vcu_can_sync_hz / message_hz)
#      (8-bit counter wraps 0..255; extended continues 256, 512, … for slow rates)
# Examples at 50 Hz sync: time 0.1 Hz → N=500; motor 10 Hz → N=5; health 1 Hz → N=50.
# Set false for lab/sim without VCU (wall-clock Hz scheduling).
vcu_can_sync_enabled=false
vcu_can_sync_bus_id=CAN0
vcu_can_sync_can_id=0090
vcu_can_sync_hz=50

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_GLOBAL_TIME_INFO → VCU (ICD §3.5.6.1, CAN ID 0x198)
# -----------------------------------------------------------------------------
sec_comp_global_time_info_enabled=true
# Hz supports decimals: 0.1 = once every 10 seconds, 1 = once per second, 10 = 10 per second
sec_comp_global_time_info_hz=0.1
sec_comp_global_time_info_bus_id=CAN0
sec_comp_global_time_info_can_id=0198
sec_comp_global_time_info_log_transmissions=true

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_MOT_DRIVE_STATUS → VCU (ICD §3.5.6.3, CAN ID 0x21A)
# -----------------------------------------------------------------------------
sec_comp_mot_drive_status_enabled=false
sec_comp_mot_drive_status_hz=1
sec_comp_mot_drive_status_bus_id=CAN0
sec_comp_mot_drive_status_can_id=021A
sec_comp_mot_drive_status_relay_front=true
sec_comp_mot_drive_status_relay_rear=true
sec_comp_mot_drive_status_log_transmissions=true

# Data source: live (MCU telemetry), dummy (fixed values), replay (CSV files).
sec_comp_mot_drive_status_data_source=live
sec_comp_mot_drive_status_replay_front_csv=
sec_comp_mot_drive_status_replay_rear_csv=
sec_comp_mot_drive_status_replay_row=last

# Dummy values when data_source=dummy.
sec_comp_mot_drive_status_dummy_front_brake_on=true
sec_comp_mot_drive_status_dummy_front_m1_mode=Speed
sec_comp_mot_drive_status_dummy_front_m2_mode=Speed
sec_comp_mot_drive_status_dummy_rear_brake_on=true
sec_comp_mot_drive_status_dummy_rear_m1_mode=Speed
sec_comp_mot_drive_status_dummy_rear_m2_mode=Speed

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_DRIVE_MOTOR_HEALTH (0x21D) + SEC_COMP_DRIVE_MOTOR_CONTROLLER_HEALTH (0x21E)
# Motor faults per ICD v1.5 — no timestamp, combines front+rear in each frame.
# -----------------------------------------------------------------------------
motor_fault_relay_enabled=true
motor_fault_relay_hz=1
motor_fault_relay_bus_id=CAN0
motor_fault_relay_motor_health_can_id=0204
motor_fault_relay_controller_health_can_id=0227
motor_fault_relay_motor_health=true
motor_fault_relay_controller_health=true
motor_fault_relay_log_transmissions=true

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_LV_CHARGER_STATUS (0x21B) + STATUS_2 (0x21C) from VE.Direct
# -----------------------------------------------------------------------------
sec_comp_lv_charger_status_enabled=true
sec_comp_lv_charger_status_hz=1
sec_comp_lv_charger_status_bus_id=CAN0
sec_comp_lv_charger_status_can_id=021B
sec_comp_lv_charger_status_2_can_id=021C
sec_comp_lv_charger_status_relay_1=true
sec_comp_lv_charger_status_relay_2=true
sec_comp_lv_charger_status_log_transmissions=true

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_INTERFACE_HEALTH → VCU (ICD §3.5.6.2, CAN ID 0x225)
# -----------------------------------------------------------------------------
sec_comp_interface_health_enabled=true
sec_comp_interface_health_hz=1
sec_comp_interface_health_bus_id=CAN0
sec_comp_interface_health_can_id=0225
sec_comp_interface_health_control_bus_id=CAN2
sec_comp_interface_health_auxiliary_bus_id=CAN0
sec_comp_interface_health_actuator_bus_id=CAN1
# Jetson: enP8p1s0 | Dynalog hub NIC: telematics_eth (MAC 04:2b:58:1d:41:62 → systemd .link)
sec_comp_interface_health_ethernet_interface=enP8p1s0
sec_comp_interface_health_storage_path=/
sec_comp_interface_health_cpu_fault_threshold_pct=90
sec_comp_interface_health_memory_fault_threshold_pct=90
sec_comp_interface_health_storage_min_free_gb=1
sec_comp_interface_health_fault_confirm_sec=5
sec_comp_interface_health_log_transmissions=true

# -----------------------------------------------------------------------------
# Receive: VCU_PWR_OFF_REQ2 (0x208 → flush logs → host shutdown)
# -----------------------------------------------------------------------------
vcu_pwr_off_req2_enabled=true
vcu_pwr_off_req2_bus_id=CAN0
vcu_pwr_off_req2_can_id=0208
# From Docker: power off host via PID 1. Native: shutdown -h now
vcu_pwr_off_req2_shutdown_command=nsenter -t 1 -m -u -i -n -p shutdown -h now

# -----------------------------------------------------------------------------
# CAN bus device mapping
# -----------------------------------------------------------------------------
# Each bus picks its backend from canN_device alone (no extra flag):

# Jetson wiring (stable udev — see udev/99-telematics-usb-serial.rules):
#   CAN0 auxiliary  → /dev/telematics/can0        (USB hub port 2, CH340)
#   Motor front     → /dev/telematics/motor_front  (USB hub port 3)
#   Motor rear      → /dev/telematics/motor_rear   (USB hub port 1)
#   Ethernet health → enP8p1s0
#   CAN1 actuator   → can1                         (SocketCAN when present)
#   CAN2 control    → comp_can                     (SocketCAN when present)
#
# Dynalog reference (other compute — do not use on this Jetson):
#   can0_device=can_auxiliary
#   can1_device=/dev/telematics/can_actuator
#   can2_device=can_control
#
# A .trc file is created only when canN_enabled=true.
# Each USB tty must be assigned to at most one consumer (CAN or motor).

# CAN0 auxiliary — Jetson USB-CAN /dev/telematics/can0
can0_id=CAN0
can0_enabled=true
can0_device=/dev/telematics/can0
can0_trace_file=ugv_auxiliary.trc
can0_log_name=auxiliary
can0_bus_number=1
can0_forward_udp=true
can0_udp_port=5005

# CAN1 Actuator — SocketCAN can1 (when present)
can1_id=CAN1
can1_enabled=true
can1_device=can1
can1_trace_file=ugv_actuator.trc
can1_log_name=Actuator
can1_bus_number=2
can1_forward_udp=false
can1_udp_port=0

# CAN2 control — SocketCAN comp_can (when present)
can2_id=CAN2
can2_enabled=true
can2_device=comp_can
can2_trace_file=ugv_control.trc
can2_log_name=control
can2_bus_number=3
can2_forward_udp=false
can2_udp_port=0
