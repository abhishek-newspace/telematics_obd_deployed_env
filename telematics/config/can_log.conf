# =============================================================================
# CAN LOG CONFIGURATION (can_log.conf)
# =============================================================================
# CAN bus trace logging (.trc), USB-CAN parser, SEC_COMP relays to VCU, simulation,
# and VCU power-off handling.
#
# Companion file: config/motor_log.conf (motor RS485/CAN telemetry and drive).
#
# Environment overrides (see src/config/Config.cpp):
#   UGV_ID                  — vehicle identifier
#   CAN_LOG_CONFIG          — path to this file (alias: TELEMATICS_CONFIG)
#   TELEMATICS_SIMULATION_MODE — true/false
#   TELEMATICS_LOG_DIR      — base log directory
#   TELEMATICS_UDP_HOST     — UDP forward destination for raw serial chunks
# =============================================================================

# -----------------------------------------------------------------------------
# Identity & runtime mode
# -----------------------------------------------------------------------------
# Vehicle ID written into log session metadata.
ugv_id=UGV_IRIS_DEFAULT_01

# true = no hardware; simulated CAN frames. false = read USB-CAN adapters.
simulation_mode=false

# Path to motor telemetry config (relative to working directory or absolute).
motor_config_path=config/motor_log.conf

# Path to GNSS relay + log config.
gnss_config_path=config/gnss_log.conf

# Application log level: trace, debug, info, warn, error.
app_log_level=info

# -----------------------------------------------------------------------------
# CAN trace logging (.trc output)
# -----------------------------------------------------------------------------
# Root directory for all log output (CAN + motor subdirs below).
log_base_dir=data

# Subdirectory under log_base_dir for CAN .trc files.
log_can_subdir=can_logs

# Folder prefix for each power-cycle session (e.g. power_cycle_001).
log_power_cycle_prefix=power_cycle_

# Periodic flush interval for open .trc files (seconds).
log_flush_interval_sec=3

# PCAN-View trace file header fields.
log_pcan_version=2.0
log_generator_name=Iris Telematics v1.1
log_can_protocol=CAN
log_can_bitrate=500 kbit/s

# Rotate .trc when file exceeds this size (MB); keep at most N files per bus.
log_max_trace_file_size_mb=100
log_max_trace_files_per_bus=10

# Bounded queue between CAN ingest threads and logging thread.
ingest_queue_max_frames=100000

# Stop writing logs when free disk space drops below this threshold (MB).
disk_min_free_mb=500
disk_check_interval_sec=5

# false = wall-clock timestamps in .trc; true = monotonic + 0x202 anchor.
log_use_monotonic_timestamps=true

# Write session_manifest.txt in each can/motor power-cycle folder.
# Optional now — .trc / motor CSV already embed #;/TRC metadata headers.
log_session_manifest=false

# -----------------------------------------------------------------------------
# UDP forwarding (optional raw serial mirror to OBD / debug host)
# -----------------------------------------------------------------------------
udp_host=127.0.0.1

# -----------------------------------------------------------------------------
# USB-CAN serial link (hardware mode)
# -----------------------------------------------------------------------------
serial_baud=2000000
serial_read_buffer=1024
serial_poll_interval_us=1000
serial_config_delay_us=100000
serial_port_wait_timeout_sec=0
serial_connect_retry_sec=2

# -----------------------------------------------------------------------------
# Simulation (only when simulation_mode=true)
# -----------------------------------------------------------------------------
# Interval between simulated frame/chunk injections (microseconds).
simulation_interval_us=100000

# true = CAN0 runs stress playlist through reassembler; false = basic frame loop.
simulation_stress_frames=true

# Inject VCU_PWR_OFF_REQ (0x209) after delay to test flush + host shutdown path.
# simulation_pwr_off_enabled=true
# simulation_pwr_off_delay_sec=15
# Safe dry-run (no real power-off):
# power_off_shutdown_command=touch /tmp/telematics_pwr_off_test && sync

# -----------------------------------------------------------------------------
# USB-CAN adapter frame parser
# -----------------------------------------------------------------------------
# Envelope markers: AA ... 55 around each adapter frame.
parser_frame_header=AA
parser_frame_tail=55
parser_use_frame_envelope=true

# false = log every parsed frame; true = only known ICD IDs.
parser_require_known_icd_id=false

# Support FF auxiliary marker bytes between frames.
parser_support_ff_marker=true
parser_log_ff_frames=false

# Dump bytes dropped by reassembler (misalignment debug).
parser_dump_dropped_bytes=true
parser_dropped_bytes_dir=data/can_logs/dropped_serial

# Adapter Rx/Tx markers for standard (11-bit) and extended (29-bit) CAN.
parser_rx_marker_std=C8
parser_tx_marker_std=C9
parser_rx_marker_ext=D8
parser_tx_marker_ext=D9

# Fallback when a frame cannot be parsed (simulation / error paths).
parser_default_can_id=0101
parser_default_dlc=8
parser_default_payload=09 60 00 0F 00 63 F0 A0

# -----------------------------------------------------------------------------
# Receive: COMP_GLOBAL_TIME_INFO (0x202) from main compute
# -----------------------------------------------------------------------------
# When log_use_monotonic_timestamps=true, first valid 0x202 sets trace time anchor.
comp_global_time_info_set_system_clock=true
comp_global_time_info_sync_interval_sec=10
comp_global_time_info_can_id=0202

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_GLOBAL_TIME_INFO → VCU (ICD §3.5.6.1, CAN ID 0x198)
# -----------------------------------------------------------------------------
sec_comp_global_time_info_enabled=true
# Hz supports decimals: 0.1 = once every 10 seconds, 1 = once per second, 10 = 10 per second
sec_comp_global_time_info_hz=0.1
sec_comp_global_time_info_bus_id=CAN0
sec_comp_global_time_info_can_id=0198
sec_comp_global_time_info_log_transmissions=true

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_MOT_DRIVE_STATUS → VCU (ICD §3.5.6.3, CAN ID 0x21A)
# -----------------------------------------------------------------------------
sec_comp_mot_drive_status_enabled=true
sec_comp_mot_drive_status_hz=1
sec_comp_mot_drive_status_bus_id=CAN0
sec_comp_mot_drive_status_can_id=021A
sec_comp_mot_drive_status_relay_front=true
sec_comp_mot_drive_status_relay_rear=true
sec_comp_mot_drive_status_log_transmissions=true

# Data source: live (MCU telemetry), dummy (fixed values), replay (CSV files).
sec_comp_mot_drive_status_data_source=live
sec_comp_mot_drive_status_replay_front_csv=
sec_comp_mot_drive_status_replay_rear_csv=
sec_comp_mot_drive_status_replay_row=last

# Dummy values when data_source=dummy.
sec_comp_mot_drive_status_dummy_front_brake_on=true
sec_comp_mot_drive_status_dummy_front_m1_mode=Speed
sec_comp_mot_drive_status_dummy_front_m2_mode=Speed
sec_comp_mot_drive_status_dummy_rear_brake_on=true
sec_comp_mot_drive_status_dummy_rear_m1_mode=Speed
sec_comp_mot_drive_status_dummy_rear_m2_mode=Speed

# -----------------------------------------------------------------------------
# Relay: SEC_COMP_INTERFACE_HEALTH → VCU (ICD §3.5.6.2, CAN ID 0x225)
# -----------------------------------------------------------------------------
sec_comp_interface_health_enabled=true
sec_comp_interface_health_hz=1
sec_comp_interface_health_bus_id=CAN0
sec_comp_interface_health_can_id=0225
sec_comp_interface_health_control_bus_id=CAN2
sec_comp_interface_health_auxiliary_bus_id=CAN0
sec_comp_interface_health_actuator_bus_id=CAN1
sec_comp_interface_health_ethernet_interface=enp1s0
sec_comp_interface_health_storage_path=/
sec_comp_interface_health_cpu_fault_threshold_pct=90
sec_comp_interface_health_memory_fault_threshold_pct=90
sec_comp_interface_health_storage_min_free_gb=1
sec_comp_interface_health_fault_confirm_sec=5
sec_comp_interface_health_log_transmissions=true

# -----------------------------------------------------------------------------
# Receive: VCU_PWR_OFF_REQ2 (0x208 → flush logs → host shutdown)
# -----------------------------------------------------------------------------
vcu_pwr_off_req2_enabled=false
vcu_pwr_off_req2_bus_id=CAN0
vcu_pwr_off_req2_can_id=0208
# From Docker: power off host via PID 1. Native: shutdown -h now
vcu_pwr_off_req2_shutdown_command=nsenter -t 1 -m -u -i -n -p shutdown -h now

# -----------------------------------------------------------------------------
# CAN bus device mapping
# -----------------------------------------------------------------------------
# Each bus picks its backend from canN_device alone (no extra flag):

# Dynalog (default below):
#   CAN0 auxiliary  → SocketCAN can_auxiliary                 (EMUC ch2)
#   CAN1 Actuator   → USB-CAN /dev/telematics/can_actuator    (Bus1 Port3 CH340)
#   CAN2 control    → SocketCAN can_control                   (EMUC ch1)
#   Ethernet health → enp1s0
#
# Jetson (all USB-CAN) example — swap device lines only:
#   can0_device=/dev/telematics/can0
#   can1_device=/dev/telematics/can1
#   can2_device=/dev/telematics/can2
#
# A .trc file is created only when canN_enabled=true.
# Each USB tty must be assigned to at most one consumer (CAN or motor).

# CAN0 auxiliary — Dynalog built-in SocketCAN (EMUC ch2)
can0_id=CAN0
can0_enabled=true
can0_device=can_auxiliary
can0_trace_file=ugv_auxiliary.trc
can0_log_name=auxiliary
can0_bus_number=1
can0_forward_udp=true
can0_udp_port=5005

# CAN1 Actuator — external USB-CAN on Bus1 Port 4 (CH340, ttyUSB0)
can1_id=CAN1
can1_enabled=true
can1_device=/dev/telematics/can_actuator
can1_trace_file=ugv_actuator.trc
can1_log_name=Actuator
can1_bus_number=2
can1_forward_udp=false
can1_udp_port=0

# CAN2 control — Dynalog built-in SocketCAN (EMUC ch1)
can2_id=CAN2
can2_enabled=true
can2_device=can_control
can2_trace_file=ugv_control.trc
can2_log_name=control
can2_bus_number=3
can2_forward_udp=false
can2_udp_port=0
