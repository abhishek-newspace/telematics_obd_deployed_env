# =============================================================================
# L-BAND RADIO LOG CONFIGURATION (lband_log.conf)
# =============================================================================
# ICD §5.1 — L-Band radio MAVLink over Ethernet (UDP).
# Telematics binds UDP on the ethernet hub and archives raw datagrams.
#
# Companion: config/can_log.conf (sets lband_config_path).
# Environment override: LBAND_LOG_CONFIG
#
# ICD IP scheme (reference):
#   Radio (Compute) 192.168.168.152 :7000  →  Radio (GCS) 192.168.168.153 :7500
#   Radio (GCS)     192.168.168.153 :7500  →  Radio (Compute) 192.168.168.152 :7000
# =============================================================================

# -----------------------------------------------------------------------------
# Enable / identity
# -----------------------------------------------------------------------------
lband_enabled=true
ugv_id=UGV_IRIS_DEFAULT_01

# -----------------------------------------------------------------------------
# File logging (under data/lband_logs/ by default)
# -----------------------------------------------------------------------------
log_subdir=lband_logs
log_power_cycle_prefix=power_cycle_
log_filename=lband_raw.bin
log_session_manifest=false
log_flush_interval_sec=3
log_max_file_size_mb=100
log_max_log_files=10

# -----------------------------------------------------------------------------
# UDP receive (bind on ethernet attached to hub)
# -----------------------------------------------------------------------------
bind_host=0.0.0.0
bind_ports=7000,7500
# Optional: only keep datagrams from this source IP (empty = accept all).
# Real ethernet (observed): COMP/radio 192.168.168.98 → :7500, GCS 192.168.168.99 → :7000.
# Host telematics_eth is typically 192.168.168.100. Keep empty to log BOTH directions.
filter_source_host=
# filter_source_host=192.168.168.98
recv_timeout_ms=2000
bind_retry_sec=5

# -----------------------------------------------------------------------------
# Status logging
# -----------------------------------------------------------------------------
status_log_interval_sec=10

# -----------------------------------------------------------------------------
# Radio health (MAVLink RADIO_STATUS / ICD COMP_RADIO_STATUS msg 109)
# Industry standard for SiK/telemetry radios: RSSI, remrssi, noise, txbuf, errors.
# CSV is written beside the raw UDP archive in the same power_cycle folder.
# -----------------------------------------------------------------------------
health_parse_enabled=true
health_log_enabled=true
health_log_filename=lband_radio_health.csv

# -----------------------------------------------------------------------------
# Simulator — ICD §5.1 MAVLink2 messages (disable when real radio is online)
# -----------------------------------------------------------------------------
# Sends COMP→GCS to sim_comp_dest_port and GCS→COMP to sim_gcs_dest_port so
# both bind_ports receive traffic for logging.
#
# ICD §5.1.3 IDs used in frames:
#   UGV sys=1  COMP comp=191 | GCS sys=255  MissionPlanner comp=190
#   Telemetry radio comp=68 (RADIO_STATUS / COMP_RADIO_STATUS)
#
# Messages (toggle individually):
#   Control:  COMP/GCS_HEARTBEAT(0), TIMESYNC(111), MANUAL_CONTROL(69),
#             COMMAND_LONG(76) samples (mode/arm/drive/e-stop)
#   Telemetry: UGV_SYSTEM_INFO(50001), SYSTEM_TIME(2), GPS_RAW_INT(24),
#              ATTITUDE(30), RADIO_STATUS(109)
# Simulator — leave OFF when real L-band ethernet radio is connected.
sim_enabled=false
sim_target_host=127.0.0.1
sim_comp_dest_port=7500
sim_gcs_dest_port=7000
sim_tick_ms=20
sim_comp_to_gcs=true
sim_gcs_to_comp=true
sim_comp_heartbeat=true
sim_gcs_heartbeat=true
sim_gcs_timesync=true
sim_comp_timesync=true
sim_gcs_manual_control=true
sim_gcs_commands=true
sim_comp_ugv_status=true
sim_comp_system_time=true
sim_comp_gps_raw=true
sim_comp_imu_attitude=true
sim_comp_radio_status=true
