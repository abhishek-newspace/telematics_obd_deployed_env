# =============================================================================
# VE DC-DC CHARGER (VE.Direct Text-mode) — ve_charger_log.conf
# =============================================================================
# Victron Orion / Smart BuckBoost (and similar) auto-transmit status @ 1 Hz
# over VE.Direct USB (19200 8N1). Companion: config/can_log.conf
#   ve_charger_config_path=config/ve_charger_log.conf
#
# Device (udev): /dev/telematics/ve_charger
#   by-id: usb-VictronEnergy_BV_VE_Direct_cable_VEANBXT0-if00-port0
#
# Storage: compact CSV under data/ve_charger_logs/power_cycle_*/
#   columns: epoch_us,pid,cs,err,or,v_v,i_a,p_w,dc_in_v,dc_in_a,dc_in_p
#   Scaled SI units (from wire: V_mV/1000, I_mA/1000, DC_IN_V/100, DC_IN_I/10)
#
# Environment override: VE_CHARGER_LOG_CONFIG
# =============================================================================

ve_charger_enabled=true
ugv_id=UGV_IRIS_DEFAULT_01

# -----------------------------------------------------------------------------
# File logging
# -----------------------------------------------------------------------------
log_subdir=ve_charger_logs
log_power_cycle_prefix=power_cycle_
log_filename=ve_status.csv
log_session_manifest=true
log_flush_interval_sec=3
log_max_file_size_mb=50
log_max_log_files=10

# -----------------------------------------------------------------------------
# Serial (VE.Direct)
# -----------------------------------------------------------------------------
serial_device=/dev/telematics/ve_charger
serial_baud=19200
serial_timeout_sec=1.0
port_wait_timeout_sec=0
connect_retry_sec=5

# -----------------------------------------------------------------------------
# Status logging
# -----------------------------------------------------------------------------
status_log_interval_sec=10
