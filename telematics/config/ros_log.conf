# =============================================================================
# ROS TOPIC LOG CONFIGURATION (ros_log.conf)
# =============================================================================
# Pick topics to log from main compute via rosbridge WebSocket.
#
# HOW TO ENABLE A TOPIC
#   Uncomment a topic= line below (remove leading #), or add your own:
#     topic=/my_topic,type=std_msgs/msg/String,format=jsonl
#
# FORMATS
#   jsonl       — one JSON line per message (most topics)
#   mavlink_csv — for std_msgs/msg/UInt8MultiArray byte streams (MAVLink hex CSV)
#
# OPTIONAL PER-TOPIC FIELDS
#   enabled=false          — keep line but skip (alternative to commenting out)
#   direction=COMP_TO_GCS_TX — mavlink_csv direction column label
#   file_stem=custom_name  — output file prefix (default: sanitized topic name)
#
# subscribe_all=true logs every topic minus subscribe_exclude (not recommended).
#
# Environment: ROS_LOG_CONFIG, ROS_LOG_BRIDGE_HOST, ROS_LOG_BRIDGE_HOST_FALLBACK
# =============================================================================

ros_enabled=true

ugv_id=UGV_IRIS_DEFAULT_01
log_subdir=ros
log_power_cycle_prefix=power_cycle_
log_session_manifest=false
log_flush_interval_sec=3
log_max_file_size_mb=100
log_max_log_files=10

bridge_host=10.10.60.225
bridge_host_fallback=192.168.168.98
bridge_port=9090
bridge_path=/
bridge_connect_retry_sec=5.0
bridge_recv_timeout_ms=2000
status_log_interval_sec=10

subscribe_all=false

# -----------------------------------------------------------------------------
# ACTIVE — uncomment / add lines here; restart telematics_server after edits
# -----------------------------------------------------------------------------
topic=/telemetry_tx,type=std_msgs/msg/UInt8MultiArray,format=mavlink_csv,direction=COMP_TO_GCS_TX
topic=/ros2_controller/odom,type=nav_msgs/msg/Odometry,format=jsonl

