# =============================================================================
# ROS 2 BAG RECORDING (ros_log.conf)
# =============================================================================
# Subscribes to topics on main compute via rosbridge, writes a ROS 2 bag
# (CDR) under data/.../ros_logs/ so you can replay with:
#
#   source /opt/ros/humble/setup.bash
#   ros2 bag play /path/to/ros_logs/ros_bag
#
# HOW TO ENABLE A TOPIC
#   topic=/my_topic,type=std_msgs/msg/String
#
# Message packages must exist in the telematics image (std_msgs, nav_msgs,
# geometry_msgs, sensor_msgs are installed). Custom types (scout_msgs/...)
# need that package added to the Docker image before they can be recorded.
#
# Environment: ROS_LOG_CONFIG, ROS_LOG_BRIDGE_HOST, ROS_LOG_BRIDGE_HOST_FALLBACK
# =============================================================================

ros_enabled=true

ugv_id=UGV_IRIS_DEFAULT_01
log_subdir=ros_logs
log_power_cycle_prefix=power_cycle_
log_session_manifest=true
log_flush_interval_sec=3
log_max_file_size_mb=100
log_max_log_files=10

# rosbag2 storage: mcap (default) or sqlite3
bag_storage_id=sqlite3
bag_name_stem=ros_bag
# Rewrite metadata.yaml every N seconds while recording so power cuts still leave a
# playable bag directory (rosbag2 normally writes metadata only on clean close).
bag_metadata_flush_sec=5
# Unused for ROS bags (size-only rotation via log_max_file_size_mb below).
bag_snapshot_sec=0

bridge_host=10.10.60.225
bridge_host_fallback=192.168.168.26
bridge_port=9090
bridge_path=/
bridge_connect_retry_sec=5.0
bridge_recv_timeout_ms=2000
status_log_interval_sec=10

subscribe_all=false

# -----------------------------------------------------------------------------
# ACTIVE — uncomment / add lines; restart telematics_server after edits
# -----------------------------------------------------------------------------
topic=/telemetry_tx,type=std_msgs/msg/UInt8MultiArray
topic=/ros2_controller/odom,type=nav_msgs/msg/Odometry
# topic=/software_version_tx,type=custom_msgs/msg/SoftwareVersion

