# =============================================================================
# ROS 2 BAG RECORDING (ros_log.conf)
# =============================================================================
# Subscribes via rosbridge WebSocket, writes ROS 2 MCAP under:
#   data/active/power_cycle_<ts>/ros/ros_bag/ros_bag_0.mcap
#
# topic=/name,type=pkg/msg/Type   (must match main-compute topic + type exactly)
# Restart telematics_server after edits.
# =============================================================================

ros_enabled=true

ugv_id=UGV_IRIS_DEFAULT_01
log_subdir=ros
log_power_cycle_prefix=power_cycle_
log_session_manifest=false
log_flush_interval_sec=3
log_max_file_size_mb=100
log_max_log_files=10

bag_storage_id=sqlite3
bag_name_stem=ros_bag
bag_snapshot_sec=0

# Main compute rosbridge (primary). Fallback = local bench / same-host rosbridge.
bridge_host=192.168.168.98
bridge_host_fallback=127.0.0.1
bridge_port=9090
bridge_path=/
bridge_connect_retry_sec=5.0
bridge_recv_timeout_ms=2000
status_log_interval_sec=10

subscribe_all=false

# --- Telemetry ---
topic=/telemetry_tx,type=std_msgs/msg/UInt8MultiArray

# --- Odometry ---
topic=/ros2_controller/odom,type=nav_msgs/msg/Odometry
topic=/odom/local,type=nav_msgs/msg/Odometry
topic=/odom/global,type=nav_msgs/msg/Odometry
topic=/odometry/gps,type=nav_msgs/msg/Odometry

# --- GPS / IMU ---
topic=/gps/fix,type=sensor_msgs/msg/NavSatFix
topic=/gps/filtered,type=sensor_msgs/msg/NavSatFix
topic=/gps/heading,type=sensor_msgs/msg/Imu

# --- TF (requires ros-jazzy-tf2-msgs in image) ---
topic=/tf,type=tf2_msgs/msg/TFMessage
topic=/tf_static,type=tf2_msgs/msg/TFMessage

# --- Optional (uncomment when published on main compute) ---
#topic=/telemetry_rx,type=std_msgs/msg/UInt8MultiArray
#topic=/cmd_vel,type=geometry_msgs/msg/Twist
#topic=/imu/data,type=sensor_msgs/msg/Imu
