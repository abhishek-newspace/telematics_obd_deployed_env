MaxCur_P=40
OverCur_I=50
MaxVol=60
MinVol=21
OverCur_Time=100
Kp_Idq=0
Ki_Idq=0
Tim_max1=60
Kp_Spd=1000
Ki_Spd=2000
SF_Tim_max1=0.5
LimitMaxSCw=1
LimitMaxSCCw=1
volBRes=55

Accel=100
Deceleration=100
Encoder_Pair=10
