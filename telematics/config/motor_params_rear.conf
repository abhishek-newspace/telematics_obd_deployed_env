# =============================================================================
# Rear motor controller — /app/baked/motor_params_rear.conf
#
# Used for param_checksum only (read-only verify vs 0x91 telemetry).
# 0x92 MCU flash tuning lives in motor_log.conf (save_* block at bottom).
#
# CHECKSUM uses only the ACTIVE block below (uncommented keys).
# The ORIGINAL block is tuning-sheet reference — fully commented, not hashed.
#
# EXCLUDED from checksum (commented in both blocks — live / unstable):
#   Flux_VpHz  — runtime flux observer (byte 162), changes every poll
#   Ref_A      — live current reference (byte 90/102 region)
#   SpeedRef_krpm — live speed reference (byte 86/98 region)
#   Driver_Send_ID / Driver_Receive_ID — excluded per deployment decision
#   Lsq_H / Lsd_H — measured inductances, drift between identification runs
# =============================================================================

# --- CURRENT MCU baseline (CAN Driver_Receive_ID 0x600, active for checksum) -

