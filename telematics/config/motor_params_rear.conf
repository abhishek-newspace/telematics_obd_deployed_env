# Driver_Receive_ID=0x600
CAN_Baud=4
Send_Interval=20
Drive_Downtime=20
Brake_Enable=0
Keep_vol=12
Pick_up_vol=20
Delay=2
Motor1_Mode=1
Motor1_Direction=0
Motor1_Sensor=1
Motor2_Mode=1
Motor2_Direction=1
Motor2_Sensor=1
Rs_Current=8
Ls_Current=-8
R_L_Hz=300
# Flux_VpHz=0.1546638
Rs_Ohm=0.06966011
